# Build splash_probe.ko (cont_splash live-write LKM) for OnePlus Ace 5 Pro
#
# Toolchain matching (verified against device):
#   - kernel: 6.6.147-android15-8-...-4k (KMI android15-8, GKI 6.6.118 source)
#   - clang:  r510928 (clang 18.0.0) - from OnePlus kernel_manifest pinned commit
#   - KCFI:   CONFIG_CFI_CLANG=y
#
# Strategy: build the GKI common kernel once (produces Module.symvers with
# CRCs matching device), then M= build our module. vermagic is lax (vendor
# 6.6.89 kos load on 6.6.147 kernel), CRCs + KCFI are the real gate.
#
# Usage:
#   1. Put splash_probe.c + Makefile in splash-lkm/ of this repo
#   2. Actions -> "Build splash LKM" -> Run workflow
#   3. Download splash_probe.ko, copy to device, insmod
#
name: Build splash LKM

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'GKI kernel branch (OnePlusOSS/android_kernel_common_oneplus_sm8750)'
        required: true
        default: 'oneplus/sm8750_b_16.0.0_oneplus_ace5_pro'
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      KERNEL_BRANCH: ${{ github.event.inputs.branch }}
      CLANG_COMMIT: b099698c583b8361ca771f3cc8d6af6f729f39b3
      CLANG_VERSION: r510928

    steps:
      - name: Checkout (module source lives in this repo)
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            libncurses-dev cpio rsync kmod git curl ca-certificates \
            python3 python3-pip zip unzip

      - name: Clone GKI kernel source (OnePlus SM8750 ace5 pro branch)
        run: |
          git clone --depth=1 --single-branch --branch "$KERNEL_BRANCH" \
            https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8750.git \
            kernel_common
          head -6 kernel_common/Makefile

      - name: Download clang ${{ env.CLANG_VERSION }} (sparse from pinned commit)
        run: |
          git init clang-src
          cd clang-src
          git remote add origin \
            https://git.codelinaro.org/clo/la/kernelplatform/prebuilts-master/clang/host/linux-x86.git
          git config core.sparseCheckout true
          echo "clang-$CLANG_VERSION/" > .git/info/sparse-checkout
          git -c protocol.version=2 fetch --depth=1 origin "$CLANG_COMMIT"
          git checkout FETCH_HEAD
          clang-$CLANG_VERSION/bin/clang --version | head -2

      - name: Configure kernel (gki_defconfig)
        run: |
          cd kernel_common
          export PATH="$GITHUB_WORKSPACE/clang-src/clang-${CLANG_VERSION}/bin:$PATH"
          export LLVM=1 LLVM_IAS=1
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          grep -E 'CONFIG_CFI_CLANG|CONFIG_MODVERSIONS|CONFIG_MODULE_SIG' out/.config | head

      - name: Build kernel (generates Module.symvers with matching CRCs)
        run: |
          cd kernel_common
          export PATH="$GITHUB_WORKSPACE/clang-src/clang-${CLANG_VERSION}/bin:$PATH"
          export LLVM=1 LLVM_IAS=1
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1
          ls -la out/Module.symvers && wc -l out/Module.symvers

      - name: Build splash_probe module (M=)
        run: |
          cd kernel_common
          export PATH="$GITHUB_WORKSPACE/clang-src/clang-${CLANG_VERSION}/bin:$PATH"
          export LLVM=1 LLVM_IAS=1
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            M="$GITHUB_WORKSPACE/splash-lkm" modules
          ls -la "$GITHUB_WORKSPACE/splash-lkm"/*.ko
          "$GITHUB_WORKSPACE/clang-src/clang-${CLANG_VERSION}/bin/llvm-readelf" \
            -p .modinfo "$GITHUB_WORKSPACE/splash-lkm/splash_probe.ko" | grep -iE 'vermagic|license|description'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: splash_probe_ko
          path: splash-lkm/splash_probe.ko
          if-no-files-found: error
